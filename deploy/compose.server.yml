name: health-bridge-prod
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthbridge
      POSTGRES_USER: healthbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U healthbridge -d healthbridge']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: health-bridge-api:20261018
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://healthbridge:${POSTGRES_PASSWORD:?required}@db:5432/healthbridge
      API_TOKEN: ${API_TOKEN:?required}
      READ_TOKEN: ${READ_TOKEN:?required}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:?required}
      HOSTED_PROVISIONING_ENABLED: 'false'
    ports: ['127.0.0.1:18089:8080']
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 384m
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  postgres-data:
