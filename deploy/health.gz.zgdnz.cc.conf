# Health Bridge independent virtual host. Existing sites are unchanged.
limit_req_zone $binary_remote_addr zone=healthbridge_api:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name health.gz.zgdnz.cc;
    return 308 https://health.gz.zgdnz.cc$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name health.gz.zgdnz.cc;
    ssl_certificate /www/server/panel/vhost/cert/oura.gz.zgdnz.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/oura.gz.zgdnz.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 4m;
    access_log off;
    error_log /www/wwwlogs/health-bridge.error.log warn;
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18089;
    }
    location = /api/apple-health/sync {
        limit_except POST { deny all; }
        limit_req zone=healthbridge_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18089;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/agent/ {
        limit_except GET { deny all; }
        limit_req zone=healthbridge_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18089;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
